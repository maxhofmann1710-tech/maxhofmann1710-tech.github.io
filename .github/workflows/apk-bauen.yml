name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'bauen.sh', '.github/workflows/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Android-Projekt erzeugen
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          APP_URL: ${{ vars.APP_URL }}
        run: bash bauen.sh

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: SDK-Pakete installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: App bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "FEHLER: Das Secret KEYSTORE_PASSWORD fehlt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          gradle --no-daemon assembleRelease bundleRelease

      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AboWaechter-App
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
